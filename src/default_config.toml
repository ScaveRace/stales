# Stales settings
#
# Edit this file and restart Stales to apply changes.
# Lines starting with # are comments. Delete this file to get the defaults back.

[appearance]
# Built in: midnight (dark, no colour), paper (light), graphite (grey, blue accent),
# aurora (colourful gradient), ember (warm). Ctrl+Alt+T switches while you browse;
# that choice is remembered and wins over this line until you delete
# "theme" from ~/.local/share/stales/ui.toml.
# Your own themes: ~/.config/stales/themes/<name>.css. Small tweaks: ~/.config/stales/user.css.
# Give each Space its own colour with Ctrl+Alt+C.
theme = "midnight"

# Where the tabs are: "arc" (in the sidebar on the left) or "classic" (along the top).
# Ctrl+Alt+L switches while you browse; like the theme, that choice is remembered.
layout = "arc"

[sidebar]
# Pinned tiles at the top of each Space: drag a tab there to pin it.
pinned_max = 9          # how many tiles a Space can have
pinned_per_row = 3      # tiles per row
pinned_size = "medium"  # "small", "medium" or "large"
# Folders in the tab list (like Arc): right-click or Ctrl+Shift+F to make one.
folders = true

[search]
# Which search engine to use when you type something that isn't an address.
# Built in: DuckDuckGo, Google, Brave Search, Startpage, Bing, Ecosia, Qwant, Kagi, Mojeek
# (and site searches: Wikipedia, YouTube, GitHub, Arch Wiki, AUR, docs.rs)
engine = "DuckDuckGo"

# Search suggestions while you type in the command bar (Ctrl+T / Ctrl+L).
# To get them, the words you type are sent to your search engine (or the @ engine)
# as you type, a short moment after you stop. Addresses and stales:// pages are
# never sent. Set to false to send nothing until you press Enter.
suggestions = true

# Search with another engine just once by typing its keyword with @ first:
#   @d DuckDuckGo   @g Google    @br Brave     @s Startpage  @b Bing
#   @e Ecosia       @q Qwant     @k Kagi       @m Mojeek
#   @w Wikipedia    @y YouTube   @gh GitHub    @aw Arch Wiki @aur AUR   @rs docs.rs
# Example: "@w Linus Torvalds" searches Wikipedia.

# Add your own engines. %s is where the search words go.
# [[search.custom]]
# name = "My SearXNG"
# keyword = "sx"
# url = "https://searx.example.org/search?q=%s"
# suggest_url = "https://searx.example.org/autocompleter?q=%s"   # optional, for suggestions

[keys]
# Press F1 in Stales to see every shortcut.

# Single-key commands on web pages, like Vimium or qutebrowser:
# j/k scroll, f shows letters on every link so you can click it by typing,
# H/L back/forward, J/K switch tabs, / find, ? help, and more.
# They never fire while you type in a text field (press Esc to leave one),
# and "i" sends every key to the page until you press Esc.
vim = true

# Sites that have their own single-key shortcuts, where Stales stays out of the way.
exclude = ["mail.google.com", "docs.google.com"]

# Change browser shortcuts: action = ["keys", ...]
# Keys are written like <Ctrl>t, <Ctrl><Shift>t, <Alt>Left, F5.
# [keys.bindings]
# toggle-sidebar = ["<Ctrl>s", "<Ctrl>b"]
# close-tab = ["<Ctrl>w", "<Ctrl>q"]

# Change single-key commands on pages: "key" = "action" ("none" turns a key off).
# [keys.page]
# "j" = "scroll-down"
# "x" = "none"

[passwords]
# Offer to save logins and fill them in. Passwords are kept in your system keyring
# (GNOME Keyring, KWallet, or KeePassXC), encrypted with your login, never in Stales' files.
# Fill a login with Ctrl+Shift+L or by picking it under the field.
enabled = true
# Keep logins in a separate keyring that Stales locks when you're not using it.
# Your normal login keyring stays unlocked while you're logged in, so any program
# running as you could read passwords from it; a locked keyring can't be read.
# Unlocking asks for that keyring's own password (your system's dialog).
separate_keyring = false
lock_minutes = 5

[history]
# Remember the pages you visit (see them with Ctrl+H). Stored only on this computer,
# readable only by you.
enabled = true
# Forget visits older than this many days (0 keeps everything).
keep_days = 90

[downloads]
# Ask before each download ("Save" / "Cancel").
ask = true
# Where downloads go. Empty means your Downloads folder.
folder = ""

[web]
# How Stales introduces itself to websites. Leave empty for the default
# (a current Safari, which is what Stales' engine is). Only change it if a site
# refuses to work, e.g. to pretend to be Chrome.
user_agent = ""
# Keep one empty page ready in the background, so a new tab opens about a tenth
# of a second faster. Costs one extra helper process (roughly 60-100 MB of memory).
preload_tab = true
# May videos start playing by themselves?
#   "allow"  yes (a video you open, e.g. on YouTube, starts right away)
#   "muted"  only without sound (WebKit's default; YouTube then waits or starts muted)
#   "never"  only when you press play
autoplay = "allow"
# How the window is drawn: "gl" (OpenGL, fastest with WebKit), "vulkan", or "auto"
# (GTK's choice, Vulkan in newer versions). With Vulkan, Intel graphics copy every
# frame of a page through normal memory, which costs a lot of CPU during videos.
# Takes effect after a restart.
renderer = "gl"
