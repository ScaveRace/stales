[package]
name = "stales"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "A fast, keyboard-driven, fully customisable web browser for Linux with an Arc-style sidebar"
readme = "README.md"
repository = "https://github.com/ScaveRace/stales"
keywords = ["browser", "webkit", "gtk4", "linux", "arc"]
categories = ["gui", "web-programming"]

[dependencies]
adblock = { version = "0.13.5", features = ["content-blocking"] }
async-channel = "2.5.0"
base64 = "0.23.1"
# GTK 4.14+ (Ubuntu 24.04 and newer, current Arch)
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libc = "0.2.191"
libsecret = { version = "0.9", features = ["v0_19"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
soup3 = "0.9"
toml = "1.2.1"
toml_edit = "0.25.19"
# WebKitGTK 6.0, version 2.40 or newer
webkit6 = "0.6.1"

[profile.release]
# Smaller and faster binary; slower to build.
lto = true
codegen-units = 1
strip = true
panic = "abort"
